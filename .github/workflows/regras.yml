# Publica as regras do Firestore (firestore.rules) no Firebase, com a chave da conta de serviço.
# Corre sozinho quando firestore.rules muda; também se pode correr à mão (Actions → Publicar regras → Run workflow).
name: Publicar regras

on:
  push:
    paths:
      - firestore.rules
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regras
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notificacoes/package-lock.json
      - name: Instalar
        working-directory: notificacoes
        run: npm ci --no-audit --no-fund
      - name: Publicar firestore.rules
        working-directory: notificacoes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node regras.js
