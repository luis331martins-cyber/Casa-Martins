<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reparar a app</title>
<style>body{font:17px -apple-system,system-ui,sans-serif;background:#f2f2f7;color:#1c1c1e;margin:0;padding:40px 20px;text-align:center}
@media (prefers-color-scheme:dark){body{background:#000;color:#f2f2f7}}p{max-width:420px;margin:12px auto;line-height:1.4}</style></head>
<body><h1>🏠 A reparar…</h1><p id="m">A limpar a cópia guardada da app. Os teus dados não são apagados.</p>
<script>
/* Tira o service worker e as cópias guardadas (só ficheiros da app; os dados ficam) e volta a abrir a app */
(async()=>{const m=document.getElementById("m");
  try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}
  try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  m.textContent="Pronto! A abrir a app…";setTimeout(()=>location.replace("./?v="+Date.now()),1200)})();
</script></body></html>
